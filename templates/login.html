<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | کنترل حمل ورق فراسکو</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #1F4E79, #2E75B6); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 400px; margin: auto; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card login-card p-4">
      <h4 class="text-center mb-1">کنترل حمل ورق فراسکو</h4>
      <p class="text-center text-muted small mb-4">ورود به سیستم</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">نام کاربری</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">ورود</button>
      </form>
      <hr>
      <p class="small text-muted mb-0">
        کاربران نمونه:<br>
        admin / admin123 &nbsp;|&nbsp; herasat / herasat123<br>
        anbar / anbar123 &nbsp;|&nbsp; project / project123
      </p>
    </div>
  </div>
</body>
</html>
