[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .

# پوشه‌هایی که هرگز نباید جمع‌آوری شوند
norecursedirs =
    .git
    .venv
    venv
    env
    .tox
    .idea
    .vscode
    __pycache__
    node_modules
    data
    uploads
    static
    .pytest_cache

# مارکرهای سفارشی (با --strict-markers، هر مارکر خارج از این لیست خطا می‌دهد)
markers =
    slow: تست‌های کندتر (دیتابیس، آپلود فایل، اکسل)
    integration: تست‌های یکپارچگی با SQLite/PostgreSQL واقعی
    unit: تست‌های واحد بدون DB

# هشدارها
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    ignore::DeprecationWarning:flask.*
    ignore::DeprecationWarning:werkzeug.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:flask_sqlalchemy.*
    ignore::DeprecationWarning:flask_login.*
    ignore:.*utcnow.*:DeprecationWarning

# خروجی و رفتار
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals
    --durations=10

# لاگ برای دیباگ دیتابیس
log_cli = false
log_cli_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# کش در پوشهٔ مجزا تا با coverage/IDE قاطی نشود
cache_dir = .pytest_cache
